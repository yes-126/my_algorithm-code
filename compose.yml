# 실습 컨테이너 하나. 저장소 루트에서 실행한다.
#
#   docker compose up -d              # 컨테이너 기동
#   docker compose exec lab bash      # 컨테이너 셸로 들어가기
#   docker compose down               # 중지·정리
#
# 컨테이너를 여러 개로 나누지 않는다. C와 Python이 같은 이미지 안에 있어야
# 두 구현을 나란히 돌려 비교할 수 있다.
services:
  lab:
    build: .
    # 저장소 폴더가 곧 작업 폴더다. 호스트에서 고친 코드가 바로 반영된다.
    working_dir: /work
    volumes:
      - .:/work
    # 서버가 아니라 작업대다. 떠 있기만 하면 되고, 실제 작업은 exec으로 한다.
    command: sleep infinity
